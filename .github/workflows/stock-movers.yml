name: Update stock movers

on:
  schedule:
    # 15:00 UTC = 미 동부 정규장(9:30 ET) 개장 후, 서머타임 여부와 무관하게 항상 개장 이후가 되는 시각
    # (겨울 EST 기준 30분 후 / 여름 EDT 기준 1시간 30분 후) - 장 초반 변동이 큰 종목을 선별
    - cron: '0 15 * * 1-5'
    # 21:30 UTC = 미 동부 정규장(16:00 ET) 마감 후, 서머타임 여부와 무관하게 안전한 시각
    # - 마감 시점 기준으로 변동이 큰 종목을 다시 선별한다 (open 스캔 결과는 그대로 남겨둠)
    - cron: '30 21 * * 1-5'
    # 12:30 UTC = 익일 정규장 개장 최소 1시간 전, 서머타임 여부와 무관하게 항상 개장 1시간 이상 전이 되는 시각
    # - 전날의 open/close 스캔 데이터를 비운다
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드'
        type: choice
        options:
          - open
          - close
          - clear
        default: open

permissions:
  contents: write

jobs:
  fetch-movers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * 1-5" ]; then
            echo "value=open" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then
            echo "value=close" >> "$GITHUB_OUTPUT"
          else
            echo "value=clear" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch S&P 500 movers
        if: steps.mode.outputs.value == 'open' || steps.mode.outputs.value == 'close'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-movers.js ${{ steps.mode.outputs.value }}

      - name: Clear stock movers data
        if: steps.mode.outputs.value == 'clear'
        run: node scripts/clear-movers.js

      - name: Commit updated movers data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movers-open.json data/movers-close.json
          git diff --cached --quiet || git commit -m "Update stock movers data (${{ steps.mode.outputs.value }})"
          git pull --rebase origin master
          git push
