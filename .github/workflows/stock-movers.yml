name: Update stock movers

on:
  schedule:
    # 장개장(9:30 ET) 30분 후 = 10:00 ET, 장개장 변동이 큰 종목을 선별.
    # 서머타임 여부에 따라 ET->UTC 오프셋이 달라지므로 두 크론으로 나눠서 둘 다 "장개장 30분 후"를 맞춘다.
    # 분 단위를 정각(:00)에서 살짝 떨어뜨려 GitHub Actions 스케줄 혼잡 시간대(정각/30분)를 피한다.
    # 14:06 UTC = 10:06 ET (서머타임/EDT 기간, 대략 3~10월)
    - cron: '6 14 * 3-10 1-5'
    # 15:06 UTC = 10:06 ET (표준시/EST 기간, 대략 11~2월)
    - cron: '6 15 * 11,12,1,2 1-5'
    # 장마감(16:00 ET) 30분 후 - 이것도 서머타임에 따라 UTC 오프셋이 달라지므로 개장과 동일하게 두 크론으로 나눈다.
    # - 장마감 시점 기준으로 변동이 큰 종목을 다시 선별한다 (open 스캔 결과는 그대로 남겨둠)
    # 20:34 UTC = 16:34 ET (서머타임/EDT 기간, 대략 3~10월)
    - cron: '34 20 * 3-10 1-5'
    # 21:34 UTC = 16:34 ET (표준시/EST 기간, 대략 11~2월)
    - cron: '34 21 * 11,12,1,2 1-5'
    # 13:04 UTC = 익일 정규장 개장(가장 이른 경우 14:06 UTC) 1시간 이상 전, 서머타임 여부와 무관하게 항상 안전한 시각
    # - 전날의 장개장/장마감 스캔 데이터를 비운다
    - cron: '4 13 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드'
        type: choice
        options:
          - open
          - close
          - clear
        default: open

permissions:
  contents: write

jobs:
  fetch-movers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "6 14 * 3-10 1-5" ] || [ "${{ github.event.schedule }}" = "6 15 * 11,12,1,2 1-5" ]; then
            echo "value=open" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "34 20 * 3-10 1-5" ] || [ "${{ github.event.schedule }}" = "34 21 * 11,12,1,2 1-5" ]; then
            echo "value=close" >> "$GITHUB_OUTPUT"
          else
            echo "value=clear" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch S&P 500 movers
        if: steps.mode.outputs.value == 'open' || steps.mode.outputs.value == 'close'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-movers.js ${{ steps.mode.outputs.value }}

      - name: Clear stock movers data
        if: steps.mode.outputs.value == 'clear'
        run: node scripts/clear-movers.js

      - name: Commit updated movers data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movers-open.json data/movers-close.json
          git diff --cached --quiet || git commit -m "Update stock movers data (${{ steps.mode.outputs.value }})"
          git pull --rebase origin master
          git push
