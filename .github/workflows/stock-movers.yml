name: Update stock movers

on:
  schedule:
    # 21:30 UTC = 미 동부 정규장(16:00 ET) 마감 후, 서머타임 여부와 무관하게 안전한 시각
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-movers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch S&P 500 movers
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-movers.js

      - name: Commit updated movers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movers.json
          git diff --cached --quiet || git commit -m "Update stock movers data"
          git pull --rebase origin master
          git push
